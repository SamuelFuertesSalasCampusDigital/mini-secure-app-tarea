name: CD Despliegue

on:
  push:
    branches:
      - desarrollo

jobs:
  deploy:
    runs-on: self-hosted
    # Forzamos a que todos los pasos se ejecuten en la raíz del repo
    defaults:
      run:
        working-directory: ./
    
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          clean: true  # Esto limpia rastro de archivos viejos

      - name: ¿Qué archivos ve el Runner?
        run: ls -la

      - name: Parar despliegue anterior
        run: docker-compose down || true

      - name: Construir y levantar aplicación
        run: docker-compose up -d --build

      - name: Ver contenedores
        run: docker ps

      - name: Ver logs
        run: docker logs mini-secure-app --tail 50

      - name: Esperar a que arranque la aplicacion
        run: sleep 10

      - name: Comprobar aplicación
        run: curl http://localhost:3001
