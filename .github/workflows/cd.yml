name: CD Despliegue

on:
  push:
    branches:
      - desarrollo

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Debug - Ver donde estamos
        run: |
          pwd
          ls -la

      - name: Parar despliegue anterior
        run: |
          docker-compose down || docker compose down || true

      - name: Construir y levantar aplicación
        run: |
          # Intentamos con guion y sin guion por si la version de docker cambio
          docker-compose up -d --build || docker compose up -d --build

      - name: Ver contenedores
        run: docker ps

      - name: Ver logs
        run: docker logs mini-secure-app --tail 50

      - name: Esperar a que arranque
        run: sleep 10

      - name: Comprobar aplicación
        run: curl http://localhost:3001
